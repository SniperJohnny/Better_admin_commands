plugins {
    id 'java'
    id("xyz.jpenilla.run-paper") version "2.3.1"
    id("com.gradleup.shadow") version "8.3.5"
}

group = 'io.sniperjohnny.github'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
    maven {
        name = "papermc-repo"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
    // Vault API is only published through JitPack
    maven {
        name = "jitpack"
        url = "https://jitpack.io"
    }
}

dependencies {
    compileOnly("io.papermc.paper:paper-api:1.21.11-R0.1-SNAPSHOT")

    // Vault economy API - provided by the Vault plugin at runtime
    compileOnly("com.github.MilkBowl:VaultAPI:1.7") {
        exclude group: "org.bukkit", module: "bukkit"
    }

    // LuckPerms API - provided by the LuckPerms plugin at runtime. Used to read
    // group prefixes for /nick only; the plugin never writes to LuckPerms.
    compileOnly("net.luckperms:api:5.5")

    // MySQL / MariaDB driver - bundled into the plugin jar by shadowJar
    implementation("com.mysql:mysql-connector-j:9.1.0")
}

def serverdir = "D:\\devlopment\\Minecraft\\Plugins\\TestServer\\1.21.11\\plugins"

tasks.shadowJar {
    archiveClassifier.set("")
    destinationDirectory = file(serverdir)
    relocate("com.mysql", "io.sniperjohnny.github.better_admin_commands.libs.mysql")
}

tasks.jar {
    enabled = false
    dependsOn(tasks.shadowJar)
}

tasks {
    build {
        dependsOn(tasks.shadowJar)
    }
    runServer {
        // Configure the Minecraft version for our task.
        minecraftVersion("1.21")
    }
}

def targetJavaVersion = 21
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'

    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release.set(targetJavaVersion)
    }
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}
