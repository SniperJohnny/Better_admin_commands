# #############################################################################
#  Better_Admin_Commands
#  All settings for the plugin. Changes require a restart (except kit entries
#  which are read on every use).
# #############################################################################

# Version of this file. Do not change it by hand - the plugin uses it to add
# new options to an existing config.yml. Values you changed are never replaced.
config-version: 11

# --------------------------------------------------------------- commands ---
# Name and aliases of the plugin management command. The permission stays
# "betteradmincommands.command". Changes take effect after a restart or a
# reload of the plugin.
commands:
  root-name: "betteradmincommands"
  root-aliases:
    - "bac"
    - "betteradmin"

# ----------------------------------------------------------------- MySQL -----
# Credentials for the MySQL / MariaDB server where economy, homes and
# player data are stored. A database has to exist already - the plugin only
# creates its tables, not the database itself.
#
# The database is optional at runtime: when it cannot be reached the plugin
# still starts and keeps working from the local safe files in data/. Every
# write is mirrored into those files, so nothing is lost while MySQL is down.
database:
  # EASIEST WAY TO CONNECT: paste the connection string your hosting panel or
  # database gives you here, for example
  #   mysql://user:password@127.0.0.1:3306/better_admin_commands
  #   jdbc:mysql://user:password@127.0.0.1:3306/better_admin_commands?useSSL=false
  # The plugin works out the database type, the address, the database name and
  # the login from it, and decodes escapes such as %2B and %40. While this is
  # set, only fill in the fields below that the string does not already contain.
  connection-string: ""
  # Create the database itself when it does not exist yet. Needs an account that
  # may run CREATE DATABASE; if yours may not, create it by hand.
  create-if-missing: true

  # Used when no connection string is set above.
  host: "127.0.0.1"
  port: 3306
  name: "better_admin_commands"
  user: "root"
  password: "change_me"
  # Prefix for every table the plugin creates.
  table-prefix: "bac_"
  # Number of pooled connections. 2-8 is fine for a single server.
  pool-size: 4
  use-ssl: false
  # How often the plugin retries the connection while MySQL is unavailable,
  # in minutes. When the connection comes back the local safe files are
  # pushed into the database automatically. An admin can also force an
  # attempt right away with /betteradmincommands reconnect.
  reconnect-interval-minutes: 30
  # Extra JDBC parameters, appended to the connection url.
  connection-parameters: "useUnicode=true&characterEncoding=utf8&serverTimezone=UTC"

# ------------------------------------------------------------------ skin -----
# /skinchange puts the skin of a premium account on a player. The skin is read
# from the Mojang API - the same data NameMC shows, because NameMC itself has no
# public API. The borrowed skin is stored and applied again on every join.
skin:
  # How long a skin fetched from Mojang stays cached, in minutes. This keeps the
  # server from being rate limited when a name is requested often.
  cache-minutes: 60
  # How long to wait for an answer from Mojang, in seconds.
  timeout-seconds: 10

# ------------------------------------------------------------------ nick -----
# /nick renames a player in the tab list, above their head and in chat. The
# optional group argument borrows the prefix of a LuckPerms group, so a nick can
# be shown with a rank tag without changing any of the player's permissions.
# Requires LuckPerms to be installed; without it /nick still renames, just
# without a group prefix.
nick:
  # Nicks and groups that only server operators may use.
  restricted:
    - "dev"
    - "owner"

# --------------------------------------------------------------- auction -----
# /ah opens the whole auction house as a GUI: players list items, browse and buy
# listings, manage their own listings and collect items back from cancelled or
# expired ones. Listings are stored in MySQL and mirrored into data/auction.yml.
auction:
  enabled: true
  # Rows of the GUI windows (3-6). The bottom row is kept for navigation.
  gui-rows: 6
  # How long an active listing stays up, in hours. 0 means it never expires.
  listing-hours: 48
  # How many active listings one player may have at the same time.
  max-listings-per-player: 10
  # Percentage of the sale price the server keeps (0-100).
  tax-percent: 5.0
  # Fee charged up front when listing, as a percentage of the price (0-100).
  listing-fee-percent: 0.0
  # Allowed price range for a single listing.
  min-price: 1.0
  max-price: 1000000000.0

# ------------------------------------------------------------------ shop -----
# /shop opens the server shop. The contents are imported from EconomyShopGUI:
# every shop file found there becomes one shop here, and EconomyShopGUI is then
# turned off so the two cannot both answer to the same command. The imported
# shop lives in MySQL and is mirrored into data/shops.yml + data/shop_items.yml.
shop:
  enabled: true
  # Rows of the item windows (3-6). The bottom row is kept for navigation.
  gui-rows: 6
  # Let players sell items back where the imported data has a sell price.
  selling-enabled: true
  # Show the search button that filters every shop by item name.
  search-enabled: true
  # Who may use which shop. With the shipped defaults every shop is open to
  # everyone; set a prefix below to lock them down.
  access:
    # Permission every shop needs, with the shop id appended: the shop "blocks"
    # needs "betteradmincommands.shop.blocks". The id is the file path without
    # the extension, so "blocks/mob_drops.yml" becomes "blocks.mob_drops".
    # Leave this empty to leave every shop open.
    permission-prefix: ""
    # Shops that stay open even when a prefix is set. "*" leaves all of them open.
    free: []
    # Per-shop permission, which wins over the prefix above. Example:
    #   permissions:
    #     vip: "betteradmincommands.shop.vip"
    permissions: {}
    # Hide the shops a player cannot use instead of showing them greyed out.
    hide-locked: false
  import:
    # Read the EconomyShopGUI files on start-up when no shop is stored yet.
    enabled: true
    # Re-import on every start-up, overwriting what is stored. Use this while
    # setting the shop up; /shop import does the same thing on demand.
    force: false
    # Turn EconomyShopGUI off once its shops have been imported.
    disable-plugin: true
    # Stop after this many items, so a stray YAML file cannot flood the shop.
    max-items: 5000
    # Folder names inside plugins/ to read. Any folder whose name starts with
    # "EconomyShopGUI" is read as well, so the free and the premium edition are
    # both found without editing this.
    folders:
      - "EconomyShopGUI"
      - "EconomyShopGUI-Premium"

# ---------------------------------------------------------------- report -----
# /report opens the report system as a GUI. Players open tickets and talk to the
# staff inside them; anybody with betteradmincommands.report.staff sees every
# ticket, open and closed, and several staff can answer the same ticket.
# Reports are stored in MySQL (they have no local safe file).
report:
  # The categories offered in "Create a report". Add or remove entries freely -
  # the menu pages itself automatically when there are more than fit on a page.
  presets:
    hacking:
      display: "&cHacking"
      icon: DIAMOND_SWORD
      description: "Cheating or unfair advantages"
      target-required: true
    rulebreaking:
      display: "&6Rule breaking"
      icon: WRITABLE_BOOK
      description: "Breaking a server rule"
      target-required: true
    harassment:
      display: "&dHarassment"
      icon: PLAYER_HEAD
      description: "Insults, threats or bullying"
      target-required: true
    scamming:
      display: "&eScamming"
      icon: GOLD_INGOT
      description: "Scams or stolen items"
      target-required: true
    bugreport:
      display: "&bBug report"
      icon: TNT
      description: "Something on the server is broken"
      target-required: false

# --------------------------------------------------------------- economy -----
# The built-in economy is stored in MySQL and is exposed to other plugins
# through Vault, so any Vault-aware plugin can read and change balances.
economy:
  enabled: true
  currency-name-singular: "Dollar"
  currency-name-plural: "Dollars"
  currency-symbol: "$"
  # Balance given to a player the first time they are seen.
  starting-balance: 100.0
  # Balances above this cannot be reached.
  max-balance: 1000000000.0
  # How often dirty balances are written to the database, in seconds.
  save-interval-seconds: 300
  # Allow /pay between players.
  allow-payments: true
  # Smallest payment, to avoid pointless 0.0 transactions.
  minimum-payment: 0.01

# --------------------------------------------------------------- menus -------
# Layout of the menus that do not belong to one feature. Everything is a button;
# the commands keep their text form (see the README).
baltop:
  gui-rows: 6
mail:
  # Rows of the mailbox menu (3-6); the bottom row is navigation.
  gui-rows: 6
ignorelist:
  gui-rows: 6
jails:
  # The jail list menu. Cells are teleported to on click; /deljail is still the
  # only way to remove one, so a misclick cannot empty a cell in use.
  gui-rows: 6
  gui-icon: IRON_BARS
ptime:
  # The personal time menu and /pweather's, both opened without an argument.
  gui-rows: 3
pweather:
  gui-rows: 3
unlimited:
  gui-rows: 4
realname:
  gui-rows: 6

# ---------------------------------------------------------------- spawn ------
# Spawn coordinates are stored in spawn.yml next to config.yml, written by
# /setspawn.
spawn:
  teleport-on-join: false
  teleport-on-first-join: false
  respawn-at-spawn: false

# ----------------------------------------------------------------- homes -----
homes:
  # Default amount of homes per player. Override per player with the
  # permission "betteradmincommands.homes.limit.<amount>".
  max: 3
  # /homes opens the home menu. Left-click teleports, right-click deletes.
  gui-rows: 6
  gui-icon: RED_BED

# --------------------------------------------------------------- warps ------
# /warps opens the warp menu, where every warp is a button.
warps:
  gui-rows: 6
  gui-icon: COMPASS
  # Optional per-warp icon, e.g. "spawn: NETHER_STAR".
  gui-icons: {}

# ------------------------------------------------------------ teleporting ----
teleport:
  # Seconds a player has to stand still before a delayed teleport happens.
  warmup-seconds: 3
  # Seconds before a teleport request from /tpa expires.
  request-expire-seconds: 60
  # Seconds before /back can be used again.
  back-cooldown-seconds: 0
  # Remember the previous location of every teleport so /back works.
  back-enabled: true

# ------------------------------------------------------------ moderation -----
moderation:
  # Default mute length in seconds when none is given, -1 means permanent.
  default-mute-seconds: -1
  # Kick message players see when they try to chat while muted.
  mute-message: "&cYou are muted. &7Reason: &f%reason%"
  # Shown in the tab list in front of a vanished player. Only staff with the
  # permission betteradmincommands.vanish.see can see them at all.
  vanish-tab-cue: "&7[&8V&7] &r"

# ------------------------------------------------------------------- afk -----
afk:
  # Automatically mark players as away after the given idle time.
  auto-afk-enabled: true
  auto-afk-minutes: 10

# ------------------------------------------------------------------ jail -----
jail:
  # How far a jailed player may move away from their cell before being pulled back.
  radius: 8.0

# ------------------------------------------------------------------- rtp -----
# Random teleport targets for /rtp.
rtp:
  max-radius: 2000
  min-radius: 200
  max-attempts: 30
  disabled-worlds:
    - "world_nether"
    - "world_the_end"

# ---------------------------------------------------------------- worth -----
# Prices used by /worth and /sell. Only listed items can be sold.
worth:
  STONE: 1.0
  COBBLESTONE: 0.8
  DIRT: 0.5
  SAND: 0.6
  OAK_LOG: 1.5
  COAL: 2.0
  IRON_INGOT: 12.0
  GOLD_INGOT: 18.0
  DIAMOND: 60.0
  EMERALD: 55.0
  REDSTONE: 1.5
  LAPIS_LAZULI: 2.0
  COPPER_INGOT: 4.0
  NETHERITE_INGOT: 400.0
  WHEAT: 1.2
  CARROT: 1.0
  POTATO: 1.0
  BREAD: 2.5
  APPLE: 2.0
  STRING: 1.5
  LEATHER: 3.0
  BONE: 1.0
  FEATHER: 0.8
  GUNPOWDER: 4.0

# ------------------------------------------------------------------ kits -----
# Kits are defined here. Item format: "MATERIAL[:AMOUNT]" or
# "MATERIAL:AMOUNT:ENCHANTMENT:LEVEL". Cooldown of -1 disables the cooldown.
kits:
  starter:
    cooldown-seconds: 86400
    permission: "betteradmincommands.kit.starter"
    items:
      - "STONE_SWORD"
      - "BREAD:8"
      - "OAK_LOG:16"
      - "LEATHER_CHESTPLATE"
  tools:
    cooldown-seconds: 3600
    permission: "betteradmincommands.kit.tools"
    items:
      - "IRON_PICKAXE:1:EFFICIENCY:2"
      - "IRON_AXE"
      - "IRON_SHOVEL"

# --------------------------------------------------------------- kit menu ---
# /kit without an argument opens the kit menu. A single kit can give itself an
# icon with "icon: <MATERIAL>" in its own section above.
kit-gui:
  rows: 3
  icon: CHEST

# ---------------------------------------------------------------- message ----
messages:
  prefix: "&8[&6BetterAdmin&8] &r"
  # Shown by /motd
  motd:
    - "&6Welcome to the server!"
    - "&7Use &f/rules &7to read the rules."
  # Shown by /rules
  rules:
    - "Be nice to each other."
    - "No griefing or stealing."
    - "No cheating or exploiting bugs."
